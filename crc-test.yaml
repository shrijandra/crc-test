---
- name: Test OpenShift Connectivity — List Namespaces
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: List all namespaces
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
      register: projects_result

    - name: Show namespace count and names
      ansible.builtin.debug:
        msg: "Found {{ projects_result.resources | length }} namespaces: {{ projects_result.resources | map(attribute='metadata.name') | list }}"
